# Validates every pull request and every push to main. A green run on a main
# push is what triggers publish-site.yml, so nothing reaches the bucket
# without passing this first.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, build contract, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # check-slots (engine == quickstart version), tsc, vite build + prerender.
      - run: npm run build

      - name: Site build contract (redact-secret-sites)
        run: node scripts/check-build-contract.mjs

      - name: Deterministic build — the same commit twice gives the same site
        run: |
          mv dist "$RUNNER_TEMP/dist-first"
          npm run build
          diff -r "$RUNNER_TEMP/dist-first" dist

      - run: npm run build-storybook

  playground:
    name: Playground qualification (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and their system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      # ADR 0001 § Security review checklist, in all three engines.
      - name: Qualify the playground
        run: npm run qualify:playground

      - name: Negative control — a keystroke leak must fail the leak checks
        run: node scripts/qualify-playground.mjs --negative-control

      - name: Proposed CSP (redact-secret-sites#3), enforcing, no violations
        run: node scripts/qualify-playground.mjs --csp

      - name: Upload the qualification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-qualification
          path: docs/qualification/
          retention-days: 30
