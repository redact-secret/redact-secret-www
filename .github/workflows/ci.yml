# Validates every pull request and every push to main. A green run on a main
# push is what triggers publish-site.yml, so nothing reaches the bucket
# without passing this first.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, build contract, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Offline negative tests: unknown schemaVersion, missing provenance,
      # stale records, benchmark figures and secret-shaped values must fail.
      - name: Data contracts — negative tests
        run: npm run test:data

      # check-data (schemas, provenance, no secrets), generated-type drift,
      # check-slots (engine == quickstart version), tsc, vite build + prerender.
      - run: npm run build

      - name: Site build contract (redact-secret-sites)
        run: node scripts/check-build-contract.mjs

      # Offline, against a directory standing in for the bucket: a copy-only
      # change leaves every asset byte-identical and re-uploads none; rollback
      # restores HTML and current.json byte for byte; corrupted, partial,
      # wrong-locale, unknown-version and renderer-mismatched releases never
      # move current.json or a stable page; a secret-shaped value fails
      # before any upload and is never echoed.
      - name: Release planes — offline proofs (content, rollback, invalid releases, secrets)
        run: npm run test:publish

      - name: Deterministic build — the same commit twice gives the same site and renderer
        run: |
          mv dist "$RUNNER_TEMP/dist-first"
          mv build/renderer "$RUNNER_TEMP/renderer-first"
          npm run build
          diff -r "$RUNNER_TEMP/dist-first" dist
          diff -r "$RUNNER_TEMP/renderer-first" build/renderer

      - run: npm run build-storybook

  playground:
    name: Playground qualification (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and their system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      # ADR 0001 § Security review checklist, in all three engines.
      - name: Qualify the playground
        run: npm run qualify:playground

      - name: Negative control — a keystroke leak must fail the leak checks
        run: node scripts/qualify-playground.mjs --negative-control

      - name: Proposed CSP (redact-secret-sites#3), enforcing, no violations
        run: node scripts/qualify-playground.mjs --csp

      - name: Upload the qualification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-qualification
          path: docs/qualification/
          retention-days: 30

  architecture:
    name: Architecture pages (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers and their system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      # Every /{en,ko}/architecture/ page under the proposed CSP: loads without
      # errors, one h1 and one claim, sidebar, language switch, links, widths.
      - name: Check the architecture pages
        run: npm run check:architecture

      - name: Negative control — injected faults must fail the checks
        run: node scripts/check-architecture.mjs --negative-control --engine chromium

      # Every page, both locales and the 404: complete with JavaScript off;
      # with every JSON request failing, hydrated, unchanged and interactive.
      - name: First paint without JavaScript or JSON
        run: node scripts/check-first-paint.mjs

      - name: Negative control — without its page data a page stays complete but must not hydrate
        run: node scripts/check-first-paint.mjs --negative-control --engine chromium

      # /community/ and /ko/community/ at 360px and 1280px, with the real core
      # under the proposed CSP: the fixture is found and never shown, Continue
      # opens the exact prefilled GitHub form, and nothing typed leaves the page.
      - name: Check the community page
        run: node scripts/check-community.mjs

      - name: Negative control — without the engine the fixture check must fail
        run: node scripts/check-community.mjs --negative-control --engine chromium
