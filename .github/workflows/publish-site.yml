# Application release for www.redactsecret.com (ARCHITECTURE.md § Publish
# flow): builds a commit on main and publishes it to the bucket behind the
# www site stack that redact-secret-sites owns, using the publisher role that
# repository creates.
#
# Runs after CI passes on a push to main, never on its own: the CI run's
# commit is the one built here. A commit whose application files match the
# deployed release (only i18n/ or data/ changed) is left to
# publish-content.yml, which publishes it without a build; the `plan` job
# makes that call with scripts/publish/plan.mjs, the same rule that workflow
# uses, so exactly one of them publishes. A dispatch always builds: rolling
# the application back means dispatching this workflow with an earlier
# commit on main (CONVENTIONS.md § Deploy).
#
# Configuration lives in the repository's `production` GitHub environment, so
# this file carries no account ID, bucket name, or role ARN:
#
#   production   PUBLISHER_ROLE_ARN, SITE_STACK=redactsecret-site-www-prod
#   repository   SITE_URL (optional; default https://www.redactsecret.com)
#
# Until redact-secret-sites deploys that stack and trusts this repository's
# OIDC subject (ARCHITECTURE.md § Publish flow), those variables are unset
# and the job stops with a warning instead of failing.
name: Publish site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to publish (empty = main's head). An earlier commit rolls the application back.
        type: string
        required: false

permissions: {}

jobs:
  plan:
    name: Application or content release
    # Only a successful CI run for a push to main in this repository — never a
    # pull request, and never a fork whose branch happens to be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
    env:
      TARGET_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      # A dispatch input is untrusted: it must be a full commit SHA.
      - name: Validate the commit
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The deployed release is read from the public site; no credentials. An
      # unreadable current.json means "build" — always correct, never minimal.
      - name: Decide
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.redactsecret.com' }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "decision=app" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --max-time 20 --proto '=https' "$SITE_URL/current.json" -o "$RUNNER_TEMP/current.json" || rm -f "$RUNNER_TEMP/current.json"
          node scripts/publish/plan.mjs --current "$RUNNER_TEMP/current.json" --target "$TARGET_SHA" --output "$GITHUB_OUTPUT"

  publish:
    name: Publish to production
    needs: plan
    if: needs.plan.outputs.decision == 'app'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    # One publish at a time across both release planes, never cancelled mid-sync.
    concurrency:
      group: publish-www-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      TARGET_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the production environment is configured
        id: config
        env:
          PUBLISHER_ROLE_ARN: ${{ vars.PUBLISHER_ROLE_ARN }}
          SITE_STACK: ${{ vars.SITE_STACK }}
        run: |
          if [ -z "$PUBLISHER_ROLE_ARN" ] || [ -z "$SITE_STACK" ]; then
            echo "::warning::production environment has no PUBLISHER_ROLE_ARN/SITE_STACK yet; nothing published. See ARCHITECTURE.md § Publish flow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the commit
        if: steps.config.outputs.ready == 'true'
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a commit that is not on main
        if: steps.config.outputs.ready == 'true'
        run: git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # Everything that installs or builds runs before any AWS session exists.
      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      # dist/ (client + every page) and build/renderer/ (the renderer artifact).
      - if: steps.config.outputs.ready == 'true'
        run: npm run build

      - name: Site build contract (redact-secret-sites)
        if: steps.config.outputs.ready == 'true'
        run: node scripts/check-build-contract.mjs

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.config.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: publish-www-${{ github.run_id }}

      # Same three passes as scripts/publish-site.sh in redact-secret-sites:
      # fingerprinted assets first and kept (plus the renderer artifact under
      # releases/app/<commit>/), then everything else with revalidation and
      # stale files removed — the pages as a content release rendered by this
      # renderer, current.json last — then assets pruned once the new HTML is
      # live. Invalidates only the mutable paths that changed, never /*.
      # Change one, revisit both (CONVENTIONS.md § Deploy).
      - name: Publish
        if: steps.config.outputs.ready == 'true'
        env:
          SITE_STACK: ${{ vars.SITE_STACK }}
        run: node scripts/publish/cli.mjs app --stack "$SITE_STACK" --commit "$TARGET_SHA" --summary "$GITHUB_STEP_SUMMARY"
