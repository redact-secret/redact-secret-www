# Publishes www.redactsecret.dev: builds a commit on main and syncs dist/ to
# the bucket behind the www site stack that redact-secret-sites owns, using
# the publisher role that repository creates.
#
# Runs after CI passes on a push to main, never on its own: the CI run's
# commit is the one built here. Rolling back means dispatching this workflow
# with an earlier commit on main (CONVENTIONS.md § Deploy).
#
# Configuration lives in the repository's `production` GitHub environment, so
# this file carries no account ID, bucket name, or role ARN:
#
#   production   PUBLISHER_ROLE_ARN, SITE_STACK=redactsecret-site-www-prod
#
# Until redact-secret-sites deploys that stack and trusts this repository's
# OIDC subject (ARCHITECTURE.md § Publish flow), those variables are unset
# and the job stops with a warning instead of failing.
name: Publish site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to publish (empty = main's head). An earlier commit rolls back.
        type: string
        required: false

permissions: {}

# One publish at a time, never cancelled mid-sync.
concurrency:
  group: publish-site-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to production
    # Only a successful CI run for a push to main in this repository — never a
    # pull request, and never a fork whose branch happens to be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TARGET_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the production environment is configured
        id: config
        env:
          PUBLISHER_ROLE_ARN: ${{ vars.PUBLISHER_ROLE_ARN }}
          SITE_STACK: ${{ vars.SITE_STACK }}
        run: |
          if [ -z "$PUBLISHER_ROLE_ARN" ] || [ -z "$SITE_STACK" ]; then
            echo "::warning::production environment has no PUBLISHER_ROLE_ARN/SITE_STACK yet; nothing published. See ARCHITECTURE.md § Publish flow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A dispatch input is untrusted: it must be a full commit SHA.
      - name: Validate the commit
        if: steps.config.outputs.ready == 'true'
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a commit that is not on main
        if: steps.config.outputs.ready == 'true'
        run: git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # Everything that installs or builds runs before any AWS session exists.
      - if: steps.config.outputs.ready == 'true'
        run: npm ci

      - if: steps.config.outputs.ready == 'true'
        run: npm run build

      - name: Site build contract (redact-secret-sites)
        if: steps.config.outputs.ready == 'true'
        run: node scripts/check-build-contract.mjs

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.config.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: publish-www-${{ github.run_id }}

      # Same three passes as scripts/publish-site.sh in redact-secret-sites:
      # fingerprinted assets first and kept, then everything else with
      # revalidation and stale files removed, then assets pruned once the new
      # HTML is live. Change one, revisit both (CONVENTIONS.md § Deploy).
      - name: Publish
        if: steps.config.outputs.ready == 'true'
        env:
          SITE_STACK: ${{ vars.SITE_STACK }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # backticks below are JMESPath, not shell.
          outputs=$(aws cloudformation describe-stacks --stack-name "$SITE_STACK" \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`||OutputKey==`DistributionId`].[OutputKey,OutputValue]' \
            --output text)
          bucket=$(awk '$1=="BucketName"{print $2}' <<<"$outputs")
          distribution=$(awk '$1=="DistributionId"{print $2}' <<<"$outputs")
          [[ -n "$bucket" && -n "$distribution" ]] || { echo "::error::stack $SITE_STACK has no BucketName/DistributionId outputs"; exit 1; }

          aws s3 sync dist/assets "s3://$bucket/assets" --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync dist "s3://$bucket" --only-show-errors --delete \
            --exclude 'assets/*' --cache-control 'no-cache'
          aws s3 sync dist/assets "s3://$bucket/assets" --only-show-errors --delete \
            --cache-control 'public, max-age=31536000, immutable'

          invalidation=$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "invalidation=$invalidation" >> "$GITHUB_ENV"

      - name: Record what was published
        if: steps.config.outputs.ready == 'true'
        run: |
          {
            echo "### Published www.redactsecret.dev"
            echo
            echo "- commit: \`$TARGET_SHA\`"
            echo "- engine: \`@redact-secret/core@$(node -p "require('./package.json').dependencies['@redact-secret/core']")\`"
            echo "- slots observed: $(node -p "require('./src/slots/release.json').observedAt")"
            echo "- invalidation: \`$invalidation\`"
          } >> "$GITHUB_STEP_SUMMARY"
